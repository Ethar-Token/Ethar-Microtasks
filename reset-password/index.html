<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | MicroTasks</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #f1c8d4;
            box-shadow: 0 5px 20px rgba(150, 80, 100, 0.08);
        }

        h1 {
            text-align: center;
            color: #4a3038;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #8b6a73;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #68414d;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e7c1cd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e99ab2;
        }

        button {
            width: 100%;
            border: none;
            background: #e99ab2;
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #df88a4;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link a {
            color: #a34d68;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Reset Password</h1>

        <p class="description">
            Enter your new password below.
        </p>

        <form id="resetForm">

            <div class="form-group">

                <label for="password">New Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="At least 8 characters"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter password again"
                    minlength="8"
                    required
                >

            </div>


            <button type="submit" id="resetButton">
                Reset Password
            </button>

            <div id="message" class="message"></div>

        </form>


        <div class="login-link">
            <a href="../login/">Back to Login</a>
        </div>

    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const supabaseUrl = "https://yrighidayswskssbgwcd.supabase.co";

    const supabaseKey = "YOUR_EXISTING_ANON_KEY";

    const client = window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const resetButton = document.getElementById("resetButton");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (password.length < 8) {

            message.textContent =
                "Password must be at least 8 characters.";

            message.style.color = "#c04a68";

            return;
        }


        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            message.style.color = "#c04a68";

            return;
        }


        resetButton.textContent = "Resetting...";
        resetButton.disabled = true;

        message.textContent = "";


        try {

            const { error } = await client.auth.updateUser({

                password: password

            });


            if (error) {

                message.textContent = error.message;
                message.style.color = "#c04a68";

                resetButton.textContent = "Reset Password";
                resetButton.disabled = false;

                return;
            }


            message.textContent =
                "Password reset successfully!";

            message.style.color = "#6b9b72";

            resetButton.textContent = "Password Reset";


            setTimeout(function() {

                window.location.href = "../login/";

            }, 1500);


        } catch (err) {

            console.error(err);

            message.textContent =
                "Something went wrong. Please try again.";

            message.style.color = "#c04a68";

            resetButton.textContent = "Reset Password";
            resetButton.disabled = false;

        }

    });

</script>

</body>
</html>
