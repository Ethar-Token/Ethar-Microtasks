<script>

    const supabaseUrl = "https://yrighidayswskssbgwcd.supabase.co";

    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyaWdoaWRheXN3c2tzc2Jnd2NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDY3NDIsImV4cCI6MjEwNDAyMjc0Mn0.MEsBW0iw-uRcHyzFg4ZHU9JSbHkZH0AIMK-Di7iFGlQ";

    const client = window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const resetButton = document.getElementById("resetButton");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;


        if (password.length < 8) {

            message.textContent =
                "Password must be at least 8 characters.";

            message.style.color = "#c04a68";

            return;
        }


        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            message.style.color = "#c04a68";

            return;
        }


        resetButton.textContent = "Resetting...";
        resetButton.disabled = true;

        message.textContent = "";


        try {

            const { error } = await client.auth.updateUser({

                password: password

            });


            if (error) {

                message.textContent = error.message;
                message.style.color = "#c04a68";

                resetButton.textContent = "Reset Password";
                resetButton.disabled = false;

                return;
            }


            message.textContent =
                "Password reset successfully!";

            message.style.color = "#6b9b72";

            resetButton.textContent = "Password Reset";


            setTimeout(function() {

                window.location.href = "../login/";

            }, 1500);


        } catch (err) {

            console.error(err);

            message.textContent =
                "Something went wrong. Please try again.";

            message.style.color = "#c04a68";

            resetButton.textContent = "Reset Password";
            resetButton.disabled = false;

        }

    });

</script>
