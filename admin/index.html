<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - ETHAR</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7fa;
            color: #4a3038;
        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {
            height: 65px;
            background: #ffd6e3;
            border-bottom: 1px solid #f3b8ca;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;
        }

        .admin-title {
            font-size: 20px;
            font-weight: 700;
        }

        .logout-button {
            background: #e99ab2;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .admin-nav {
            background: white;
            border-bottom: 1px solid #f1c8d4;

            display: flex;
            gap: 5px;

            padding: 10px 25px;
        }

        .admin-nav-button {
            border: none;
            background: transparent;

            padding: 10px 16px;

            border-radius: 8px;

            color: #68414d;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        .admin-nav-button.active {
            background: #ffd6e3;
            color: #4a3038;
        }


        /* =========================
           MAIN
        ========================= */

        .admin-main {
            padding: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 20px;
        }


        /* =========================
           TABLE
        ========================= */

        .table-container {
            width: 100%;
            background: white;

            border: 1px solid #f1c8d4;
            border-radius: 12px;

            overflow-x: auto;
        }

        .withdrawal-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        .withdrawal-table th {
            background: #ffd6e3;

            color: #4a3038;

            text-align: left;

            padding: 14px 12px;

            font-size: 13px;
            font-weight: 700;

            white-space: nowrap;
        }

        .withdrawal-table td {
            padding: 14px 12px;

            border-top: 1px solid #f5dce4;

            font-size: 13px;

            vertical-align: middle;
        }

        .withdrawal-table tbody tr:hover {
            background: #fffafd;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-block;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;
        }

        .status-processing {
            background: #fff1c7;
            color: #876b00;
        }

        .status-paid {
            background: #dff5e7;
            color: #277545;
        }

        .status-rejected {
            background: #f8dce3;
            color: #a13f5c;
        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        .action-buttons {
            display: flex;
            gap: 7px;
        }

        .paid-button,
        .reject-button {
            border: none;

            padding: 7px 12px;

            border-radius: 7px;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        .paid-button {
            background: #8fd3a8;
            color: white;
        }

        .reject-button {
            background: #e99ab2;
            color: white;
        }

        .paid-button:disabled,
        .reject-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        /* =========================
           LOADING / EMPTY
        ========================= */

        .loading-message,
        .empty-message {
            text-align: center;

            padding: 50px 20px;

            color: #68414d;

            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .admin-header {
                padding: 0 15px;
            }

            .admin-title {
                font-size: 17px;
            }

            .admin-main {
                padding: 15px;
            }

            .admin-nav {
                padding: 8px 10px;

                overflow-x: auto;
            }

            .admin-nav-button {
                white-space: nowrap;
            }

        }

    </style>
</head>

                    user

                error

                window.location.href =
                    "../login/";

                return false;

                    "You are not authorized to access the admin page."

        /* =========================
           LOAD WITHDRAWALS
        ========================= */

        async function loadWithdrawals() {

            withdrawalsTableBody.innerHTML = `
                <tr>
                    <td colspan="7">
                        <div class="loading-message">
                            Loading withdrawals...
                        </div>
                    </td>
                </tr>
            `;


            /*
               Get withdrawals first.
            */

            const {
                data: withdrawals,
                error: withdrawalsError
            } = await client
                .from("withdrawals")
                .select(
                    "id, user_id, amount, created_at, status"
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (withdrawalsError) {

                console.error(
                    "Withdrawals error:",
                    withdrawalsError
                );

                withdrawalsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-message">
                                Unable to load withdrawals.
                            </div>
                        </td>
                    </tr>
                `;

                return;
            }


            if (
                !withdrawals ||
                withdrawals.length === 0
            ) {

                withdrawalsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-message">
                                No withdrawals found.
                            </div>
                        </td>
                    </tr>
                `;

                return;
            }


            /*
               Get the profiles belonging to
               these withdrawal users.
            */

            const userIds =
                [
                    ...new Set(
                        withdrawals.map(
                            withdrawal =>
                                withdrawal.user_id
                        )
                    )
                ];


            const {
                data: profiles,
                error: profilesError
            } = await client
                .from("profiles")
                .select(
                    "id, email, payment_method, payment_details"
                )
                .in(
                    "id",
                    userIds
                );


            if (profilesError) {

                console.error(
                    "Profiles error:",
                    profilesError
                );

                withdrawalsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-message">
                                Unable to load user payment information.
                            </div>
                        </td>
                    </tr>
                `;

                return;
            }


            /*
               Make profiles easy to find by user ID.
            */

            const profileMap =
                new Map(
                    (profiles || []).map(
                        profile => [
                            profile.id,
                            profile
                        ]
                    )
                );


            /*
               Build table.
            */

            withdrawalsTableBody.innerHTML =
                withdrawals.map(
                    withdrawal => {

                        const profile =
                            profileMap.get(
                                withdrawal.user_id
                            ) || {};


                        const status =
                            withdrawal.status ||
                            "Processing";


                        let statusClass =
                            "status-processing";


                        if (
                            status === "Paid"
                        ) {

                            statusClass =
                                "status-paid";

                        } else if (
                            status === "Rejected"
                        ) {

                            statusClass =
                                "status-rejected";

                        }


                        const paymentMethod =
                            profile.payment_method
                                ? formatPaymentMethod(
                                    profile.payment_method
                                )
                                : "Not set";


                        const paymentDetails =
                            profile.payment_details ||
                            "Not set";


                        const createdDate =
                            new Date(
                                withdrawal.created_at
                            ).toLocaleString();


                        const actionButtons =
                            status === "Processing"

                                ? `
                                    <div class="action-buttons">

                                        <button
                                            class="paid-button"
                                            onclick="approveWithdrawal(${withdrawal.id})"
                                        >
                                            Paid
                                        </button>

                                        <button
                                            class="reject-button"
                                            onclick="rejectWithdrawal(${withdrawal.id})"
                                        >
                                            Reject
                                        </button>

                                    </div>
                                  `

                                : "—";


                        return `

                            <tr>

                                <td>
                                    ${escapeHtml(
                                        profile.email ||
                                        "Unknown"
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        paymentMethod
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        paymentDetails
                                    )}
                                </td>

                                <td>
                                    $${Number(
                                        withdrawal.amount
                                    ).toFixed(2)}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        createdDate
                                    )}
                                </td>

                                <td>

                                    <span
                                        class="status ${statusClass}"
                                    >
                                        ${escapeHtml(status)}
                                    </span>

                                </td>

                                <td>
                                    ${actionButtons}
                                </td>

                            </tr>

                        `;

                    }
                ).join("");

        }


        /* =========================
           APPROVE WITHDRAWAL
        ========================= */

        async function approveWithdrawal(
            withdrawalId
        ) {

            const confirmed =
                confirm(
                    "Mark this withdrawal as Paid?"
                );


            if (!confirmed) {
                return;
            }


            const {
                error
            } = await client.rpc(
                "approve_withdrawal",
                {
                    p_withdrawal_id:
                        withdrawalId
                }
            );


            if (error) {

                console.error(
                    "Approve withdrawal error:",
                    error
                );

                alert(
                    error.message ||
                    "Unable to approve withdrawal."
                );

                return;
            }


            alert(
                "Withdrawal marked as Paid."
            );


            await loadWithdrawals();

        }


        /* =========================
           REJECT WITHDRAWAL
        ========================= */

        async function rejectWithdrawal(
            withdrawalId
        ) {

            const confirmed =
                confirm(
                    "Reject this withdrawal? The amount will be returned to the user's wallet."
                );


            if (!confirmed) {
                return;
            }


            const {
                error
            } = await client.rpc(
                "reject_withdrawal",
                {
                    p_withdrawal_id:
                        withdrawalId
                }
            );


            if (error) {

                console.error(
                    "Reject withdrawal error:",
                    error
                );

                alert(
                    error.message ||
                    "Unable to reject withdrawal."
                );

                return;
            }


            alert(
                "Withdrawal rejected and the money was returned to the user's wallet."
            );


            await loadWithdrawals();

        }


        /* =========================
           PAYMENT METHOD
        ========================= */

        function formatPaymentMethod(
            method
        ) {

            if (
                method === "paypal"
            ) {

                return "PayPal";

            }


            if (
                method === "usdt"
            ) {

                return "USDT (TRC-20)";

            }


            return method;

        }


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHtml(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }

                        false;

                    alert(
                        "Unable to log out. Please try again."
                    );

                    return;
                }


                window.location.href =
                    "../login/";

            }
        );


async function loadAppDownloads() {

    const tableBody =
        document.getElementById(
            "appDownloadsTableBody"
        );


    tableBody.innerHTML = `
        <tr>
            <td colspan="6">
                <div class="loading-message">
                    Loading app downloads...
                </div>
            </td>
        </tr>
    `;


    /*
       Get app download submissions.
    */

    const {
        data: downloads,
        error: downloadsError
    } = await client
        .from("app_downloads")
        .select(
            "id, user_id, app_id, app_email, status, created_at"
        )
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (downloadsError) {

        console.error(
            "App downloads error:",
            downloadsError
        );

        tableBody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty-message">
                        Unable to load app downloads.
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    if (
        !downloads ||
        downloads.length === 0
    ) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty-message">
                        No app download submissions found.
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    /*
       Get user IDs.
    */

    const userIds =
        [
            ...new Set(
                downloads.map(
                    download =>
                        download.user_id
                )
            )
        ];


    /*
       Get profiles.
    */

    const {
        data: profiles,
        error: profilesError
    } = await client
        .from("profiles")
        .select("id, email")
        .in(
            "id",
            userIds
        );


    if (profilesError) {

        console.error(
            "Profiles error:",
            profilesError
        );

        tableBody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty-message">
                        Unable to load user information.
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    /*
       Get app IDs.
    */

    const appIds =
        [
            ...new Set(
                downloads.map(
                    download =>
                        download.app_id
                )
            )
        ];


    /*
       Get app names.
    */

    const {
        data: apps,
        error: appsError
    } = await client
        .from("download_apps")
        .select(
            "id, app_name"
        )
        .in(
            "id",
            appIds
        );


    if (appsError) {

        console.error(
            "Apps error:",
            appsError
        );

        tableBody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty-message">
                        Unable to load app information.
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    /*
       Create lookup maps.
    */

    const profileMap =
        new Map(
            (profiles || []).map(
                profile => [
                    profile.id,
                    profile
                ]
            )
        );


    const appMap =
        new Map(
            (apps || []).map(
                app => [
                    app.id,
                    app
                ]
            )
        );


    /*
       Build table.
    */

    tableBody.innerHTML =
        downloads.map(
            download => {

                const profile =
                    profileMap.get(
                        download.user_id
                    ) || {};


                const app =
                    appMap.get(
                        download.app_id
                    ) || {};


                const email =
                    profile.email ||
                    "Unknown";


                const appName =
                    app.app_name ||
                    "Unknown App";


                const appEmail =
                    download.app_email ||
                    "Not provided";


                const status =
                    download.status ||
                    "Pending";


                const createdDate =
                    new Date(
                        download.created_at
                    ).toLocaleString();


                /*
                   Status styling.
                */

                let statusClass =
                    "status-processing";


                if (
                    status === "Approved"
                ) {

                    statusClass =
                        "status-paid";

                } else if (
                    status === "Rejected"
                ) {

                    statusClass =
                        "status-rejected";

                }


                /*
                   Action buttons.
                */

                const actionButtons =
                    status === "Pending"

                        ? `
                            <div class="action-buttons">

                                <button
                                    class="paid-button"
                                    onclick="approveAppDownload(${download.id})"
                                >
                                    Approve
                                </button>

                                <button
                                    class="reject-button"
                                    onclick="rejectAppDownload(${download.id})"
                                >
                                    Reject
                                </button>

                            </div>
                          `

                        : "—";


                return `

                    <tr>

                        <td>
                            ${escapeHtml(
                                email
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                appName
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                createdDate
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                appEmail
                            )}
                        </td>

                        <td>

                            <span
                                class="status ${statusClass}"
                            >
                                ${escapeHtml(
                                    status
                                )}
                            </span>

                        </td>

                        <td>
                            ${actionButtons}
                        </td>

                    </tr>

                `;

            }
        ).join("");
}

async function approveAppDownload(downloadId) {

    const confirmed =
        confirm(
            "Approve this app download and pay the user?"
        );

    if (!confirmed) {
        return;
    }

    const { error } =
        await client.rpc(
            "approve_app_download",
            {
                p_download_id: downloadId
            }
        );

    if (error) {

        console.error(
            "Approve app download error:",
            error
        );

        alert(
            error.message ||
            "Unable to approve app download."
        );

        return;
    }

    alert(
        "App download approved and user paid."
    );

    await loadAppDownloads();
}


async function rejectAppDownload(downloadId) {

    const confirmed =
        confirm(
            "Reject this app download?"
        );

    if (!confirmed) {
        return;
    }

    const { error } =
        await client.rpc(
            "reject_app_download",
            {
                p_download_id: downloadId
            }
        );

    if (error) {

        console.error(
            "Reject app download error:",
            error
        );

        alert(
            error.message ||
            "Unable to reject app download."
        );

        return;
    }

    alert(
        "App download rejected."
    );

    await loadAppDownloads();
}

        /* =========================
           START
        ========================= */

        async function startAdmin() {

            const authorized =
                await checkAdmin();


            if (!authorized) {
                return;
            }


            await loadWithdrawals();

        }


        startAdmin();

    </script>
