<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MicroTasks</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #f1c8d4;
            box-shadow: 0 5px 20px rgba(150, 80, 100, 0.08);
        }

        .login-box h1 {
            text-align: center;
            color: #4a3038;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .login-box p {
            text-align: center;
            color: #8b6a73;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #68414d;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e7c1cd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e99ab2;
        }

        .login-button {
            width: 100%;
            border: none;
            background: #e99ab2;
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #df88a4;
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .forgot-link {
            text-align: right;
            margin-top: 10px;
            font-size: 13px;
        }

        .forgot-link a {
            color: #a34d68;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #8b6a73;
        }

        .signup-link a {
            color: #a34d68;
            text-decoration: none;
            font-weight: 600;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p>Log in to continue to MicroTasks.</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Your password"
                    required
                >
            </div>

            <div class="forgot-link">
                <a href="../forgot-password/">Forgot password?</a>
            </div>

            <button type="submit" class="login-button">
                Log In
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="signup-link">
            Don't have an account?
            <a href="../signup/">Create an account</a>
        </div>

    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const supabaseUrl = "https://yrighidayswskssbgwcd.supabase.co";

    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyaWdoaWRheXN3c2tzc2Jnd2NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDY3NDIsImV4cCI6MjEwNDAyMjc0Mn0.MEsBW0iw-uRcHyzFg4ZHU9JSbHkZH0AIMK-Di7iFGlQ";

    const client = window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.querySelector(".login-button");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;


        if (!email || !password) {

            message.textContent = "Please enter your email and password.";
            message.style.color = "#c04a68";

            return;
        }


        // Change button while logging in
        loginButton.textContent = "Logging in...";
        loginButton.disabled = true;

        message.textContent = "";


        try {

            const { data, error } = await client.auth.signInWithPassword({

                email: email,
                password: password

            });


            if (error) {

                message.textContent = error.message;
                message.style.color = "#c04a68";

                loginButton.textContent = "Log In";
                loginButton.disabled = false;

                return;
            }


            // Login successful
            message.textContent = "Login successful!";
            message.style.color = "#6b9b72";

            loginButton.textContent = "Logged In";


            // Send user to main page
            window.location.href = "../";


        } catch (err) {

            console.error(err);

            message.textContent = "Something went wrong. Please try again.";
            message.style.color = "#c04a68";

            loginButton.textContent = "Log In";
            loginButton.disabled = false;

        }

    });

</script>

</body>
</html>
